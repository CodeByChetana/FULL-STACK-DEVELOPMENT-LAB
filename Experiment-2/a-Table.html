<!DOCTYPE html>
<html>
<head>
    <title>HTML Table - Rowspan and Colspan</title>
</head>
<body>

    <h1>HTML Table</h1>

    <table border="1">
        <tr>
            <td colspan="3">Student Details</td>
        </tr>

        <tr>
            <td rowspan="1">Name</td>
            <td>Subject</td>
            <td>Marks</td>
        </tr>

        <tr>
            <td rowspan="3">Devi</td>
            <td>HTML</td>
            <td>90</td>
        </tr>

        <tr>
            
            <td>CSS</td>
            <td>85</td>
        </tr>

        <tr>
            
            <td>JavaScript</td>
            <td>88</td>
        </tr>
    </table>

</body>
</html>
