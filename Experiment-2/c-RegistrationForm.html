<!DOCTYPE html>
<html>
<head>
    <title>SASI Institute of Technology - Registration Form</title>
</head>

<body>

<center>

    <h2>SASI INSTITUTE OF TECHNOLOGY</h2>
    <h3>COLLEGE REGISTRATION FORM</h3>

</center>

<form>

<table border="1" cellspacing="0" cellpadding="8" align="center">

    <!-- Name -->
    <tr>
        <td><b>Student Name</b></td>
        <td>
            <input type="text"
                   name="student_name"
                   placeholder="Enter your full name">
        </td>
    </tr>

    <!-- Password -->
    <tr>
        <td><b>Password</b></td>
        <td>
            <input type="password"
                   name="password"
                   placeholder="Create password">
        </td>
    </tr>

    <!-- Roll Number -->
    <tr>
        <td><b>Roll Number</b></td>
        <td>
            <input type="text"
                   name="roll_number"
                   placeholder="Enter roll number">
        </td>
    </tr>

    <!-- Age -->
    <tr>
        <td><b>Age</b></td>
        <td>
            <input type="number"
                   name="age"
                   min="16"
                   max="30">
        </td>
    </tr>

    <!-- DOB -->
    <tr>
        <td><b>Date of Birth</b></td>
        <td>
            <input type="date" name="dob">
        </td>
    </tr>

    <!-- Gender -->
    <tr>
        <td><b>Gender</b></td>
        <td>
            <input type="radio"
                   name="gender"
                   value="male">
            Male

            <input type="radio"
                   name="gender"
                   value="female">
            Female
        </td>
    </tr>

    <!-- Department -->
    <tr>
        <td><b>Department</b></td>
        <td>
            <select name="department">

                <option value="">
                    -- Select Department --
                </option>

                <option value="it">
                    Information Technology
                </option>

                <option value="cse">
                    Computer Science Engineering
                </option>

                <option value="AI&ML">
                    Artifial Inteligence & machine learning
                </option>

                <option value="ece">
                    Electronics and Communication Engineering
                </option>

                <option value="eee">
                    Electrical and Electronics Engineering
                </option>

                <option value="ect">
                    Electronics and Communication Technology
                </option>


                <option value="civil">
                    Civil Engineering
                </option>


                <option value="mech">
                    Mechanical Engineering
                </option>

            </select>
        </td>
    </tr>

    <!-- Year -->
    <tr>
        <td><b>Year of Study</b></td>
        <td>
            <select name="year">

                <option>First Year</option>
                <option>Second Year</option>
                <option>Third Year</option>
                <option>Fourth Year</option>

            </select>
        </td>
    </tr>

    <!-- Hobbies -->
    <tr>
        <td><b>Interests</b></td>
        <td>

            <input type="checkbox"
                   name="interest"
                   value="coding">
            Coding

            <input type="checkbox"
                   name="interest"
                   value="sports">
            Sports

            <input type="checkbox"
                   name="interest"
                   value="music">
            Music

            <input type="checkbox"
                   name="interest"
                   value="reading">
            Reading

        </td>
    </tr>

    <!-- City / List Box -->
    <tr>
        <td><b>City</b></td>
        <td>

            <input type="text"
                   name="place"
                   placeholder="Enter city/place">
        </td>
    </tr>

    <!-- Buttons -->
    <tr>
        <td colspan="2" align="center">

            <input type="submit"
                   value="Register">

            <input type="reset"
                   value="Clear">

        </td>
    </tr>

</table>

</form>

</body>
</html>
